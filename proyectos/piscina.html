.info .credits .row .v{text-align:right;font-weight:500}
.lead{margin:10px 0 6vh}.lead img{width:100%;display:block;cursor:zoom-in}
.flow{padding-bottom:30px}
.row{display:flex;gap:16px;margin-bottom:5vh;align-items:flex-start}

/* video players */

.player .badge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 color:#fff;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.player .badge .ic{width:56px;height:56px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.player .vlabel{font-size:11px;opacity:.8}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.player[data-vimeo]:not([data-vimeo='']){cursor:pointer}.player[data-vimeo]:not([data-vimeo='']):hover .poster{opacity:1}.player[data-vimeo]:not([data-vimeo='']):hover .badge .ic{background:rgba(255,255,255,.15)}.player .badge .ic{transition:background .25s}.player .poster{transition:opacity .35s}
.soon{padding:120px 0;text-align:center}.soon h2{font-size:clamp(30px,5vw,54px);font-weight:800;letter-spacing:-.02em}
.soon p{margin-top:16px;color:var(--dim);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.statement{padding:50px 0 40px}.statement .rule{border-top:1.5px dashed rgba(0,0,0,.5);width:100%;margin-bottom:40px}
.statement h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,86px);line-height:1.02}

footer{border-top:1px solid var(--line);padding:30px 0 70px;display:flex;justify-content:space-between;font-size:13px;color:var(--dim);flex-wrap:wrap;gap:14px}
footer a{color:var(--ink);text-decoration:none}footer .next b{color:var(--accent)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(20,19,17,.94);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}.lb img{max-width:92vw;max-height:90vh;object-fit:contain}.lb .x{position:absolute;top:20px;right:26px;color:#fff;font-size:26px;background:none;border:0;cursor:pointer}
@media(max-width:820px){.info{grid-template-columns:1fr;gap:24px}.row{flex-direction:column;gap:14px;margin-bottom:5vh}
 .w100,.w72,.w62,.w60,.w50,.w40{width:100%}.wrap{padding:0 20px}.head{padding:104px 0 20px}.nav{padding:14px 20px}}.player .poster{opacity:1}.player.bg .badge{inset:auto 10px 10px auto;flex-direction:row;gap:7px;padding:7px 11px;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:100px;font-size:10px;letter-spacing:.12em;opacity:.72;transition:opacity .3s;pointer-events:none}.player.bg:hover .badge{opacity:1}.player.bg .badge .ic{width:16px;height:16px;border-width:1px;font-size:8px}.player.live .badge,.player.live .poster{display:none}
.player.v{aspect-ratio:9/16}.players>div{max-width:520px}
</style></head><body><nav class="nav"><a href="../arquitectura.html">← Clear Side</a><a class="brand" href="../index.html">1*2U®</a><a href="../proyectos.html">Proyectos</a></nav><div class="wrap"><header class="head"><div class="k">[005] — Clear Side</div><h1>PISCINA</h1></header><div class="info"><div class="desc">Pieza audiovisual — Piscina. Agua, cuerpo y luz.</div><div class="credits"><div class="row"><span class="l">Cliente</span><span class="v">1*2U</span></div><div class="row"><span class="l">Año</span><span class="v">2026</span></div><div class="row"><span class="l">Rol</span><span class="v">Dirección · Cámara</span></div><div class="row"><span class="l">Lugar</span><span class="v">Medellín, CO</span></div></div></div><div class="players"><div><div class="vtitle">Piscina</div><div class="player v" data-vimeo="1223092882/d05f090ad4"><img class="poster" src="../assets/img/portfolio/piscina.jpg" alt=""><div class="badge"><span class="ic">▶</span><span>Con sonido</span></div></div></div></div><section class="statement"><div class="rule"></div><h2>Construir el mundo con <em>intención</em></h2></section><footer><a href="../proyectos.html">← Todos los proyectos</a><a class="next" href="carga.html">Siguiente — <b>CARGA</b> →</a></footer></div><div class="lb" id="lb"><button class="x" onclick="closeLb()">✕</button><img id="lbimg" src=""></div><script>
function openLb(s){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}
document.querySelectorAll('.lead img,.row img').forEach(function(im){im.addEventListener('click',function(){openLb(this.src);});});
(function(){
 function embed(p,bg){
  var a=p.dataset.vimeo.trim().split('/'),id=a[0],h=a[1]?'&h='+a[1]:'';
  var q=bg?'background=1&muted=1&loop=1&autoplay=1'
          :'title=0&byline=0&portrait=0&autoplay=1';
  var old=p.querySelector('iframe'); if(old)old.remove();
  var f=document.createElement('iframe');
  f.src='https://player.vimeo.com/video/'+id+'?'+q+'&dnt=1'+h;
  f.setAttribute('allow','autoplay;fullscreen;picture-in-picture');
  f.setAttribute('allowfullscreen','');
  p.appendChild(f);
 }
 var pls=[].slice.call(document.querySelectorAll('.player[data-vimeo]'))
           .filter(function(p){return p.dataset.vimeo.trim();});
 // clic -> abre con sonido y controles
 pls.forEach(function(p){p.addEventListener('click',function(){
  if(p.dataset.live)return; p.dataset.live='1';
  p.classList.remove('bg'); p.classList.add('live'); embed(p,false);
 });});
 // loop mudo solo cuando la pieza entra en pantalla
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
   var p=e.target;
   if(e.isIntersecting&&!p.dataset.live&&!p.dataset.bg){
    p.dataset.bg='1'; p.classList.add('bg'); embed(p,true); io.unobserve(p);
   }});},{rootMargin:'150px'});
  pls.forEach(function(p){io.observe(p);});
 } else {
  pls.forEach(function(p){p.dataset.bg='1';p.classList.add('bg');embed(p,true);});
 }
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
</script></body></html>
