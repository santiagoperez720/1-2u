<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1*2U — DISEÑO GRÁFICO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Inter:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);
 background:radial-gradient(130% 100% at 50% 0%,#f0e9dc 0%,#ece4d5 50%,#ddd0ba 100%);
 -webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
 background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:3px 3px}
.nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
 padding:18px 30px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
 background:linear-gradient(to bottom,var(--paper),rgba(236,228,213,0))}
.nav a{color:var(--ink);text-decoration:none;opacity:.85}.nav a:hover{opacity:.4}
.nav .brand{font-family:var(--sans);font-weight:800;font-size:15px;text-transform:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 34px;position:relative;z-index:1}
.head{padding:124px 0 12px;text-align:center}
.head .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.head h1{font-weight:800;font-size:clamp(40px,8vw,104px);letter-spacing:-.03em;line-height:.92;margin-top:12px}
.cover{display:flex;justify-content:center;padding:26px 0 6px}
.cover .card{position:relative;width:min(360px,64vw);transform:rotate(var(--rot,-1.5deg));
 box-shadow:0 26px 54px rgba(60,45,20,.32),0 6px 16px rgba(60,45,20,.22)}
.cover .card img{width:100%;display:block}
.cover .tape{position:absolute;top:-15px;left:50%;width:110px;height:30px;transform:translateX(-50%) rotate(-3deg);
 background:rgba(255,255,255,.35);border-left:1px dashed rgba(0,0,0,.15);border-right:1px dashed rgba(0,0,0,.15)}
.info{display:grid;grid-template-columns:1.7fr 1fr;gap:44px;padding:30px 0 28px;border-top:1px solid var(--ink);margin-top:30px}
.info .desc{font-size:clamp(16px,1.5vw,19px);line-height:1.55;max-width:60ch}

.info .credits .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.info .credits .l{color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lead{margin:6px 0 5vh}.lead img{width:100%;display:block;cursor:zoom-in}
.flow{padding-bottom:20px}
.row{display:flex;gap:16px;margin-bottom:5vh;align-items:flex-start}
.row.center{justify-content:center}.row.right{justify-content:flex-end}
.row .col{overflow:hidden}.row img{width:100%;display:block;cursor:zoom-in;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.row .col:hover img{transform:scale(1.03)}
.w100{width:100%}.w72{width:72%}.w62{width:62%}.w60{width:60%}.w50{width:50%}.w40{width:40%}
.soon{margin:26px 0 10px;border:1.5px dashed var(--ink);border-radius:3px;padding:56px 24px;text-align:center;background:rgba(255,255,255,.14)}

.soon h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,46px);margin-top:10px;font-style:italic}
.soon p{margin-top:12px;color:var(--dim);font-size:14px;max-width:46ch;margin:12px auto 0}
footer{border-top:1px solid var(--line);margin-top:30px;padding:28px 0 70px;display:flex;justify-content:space-between;
 font-family:var(--mono);font-size:12px;color:var(--dim);flex-wrap:wrap;gap:14px}
footer a{color:var(--ink);text-decoration:none}footer .next b{color:var(--accent)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(20,18,14,.95);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}.lb img{max-width:92vw;max-height:90vh;object-fit:contain}.lb .x{position:absolute;top:20px;right:26px;color:#fff;font-size:26px;background:none;border:0;cursor:pointer}

/* ---- fila de piezas (PNG transparentes) ---- */
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
 display:flex;justify-content:space-between;align-items:baseline;gap:16px;
 padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:26px}
.lab .n{color:var(--dim);letter-spacing:.1em}
.tira{margin:10px 0 62px}
.rail{display:flex;align-items:center;gap:52px;overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x proximity;padding:14px 2px 20px;cursor:grab;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing;scroll-snap-type:none}
.rail figure{flex:0 0 auto;scroll-snap-align:center}
.rail img{height:200px;width:auto;max-width:none;display:block;cursor:zoom-in;
 transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.rail figure:hover img{transform:translateY(-7px) scale(1.02)}
.barra{height:2px;background:var(--line);position:relative;border-radius:2px}
.barra i{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:2px}

/* ---- carrusel de portadas (JPG) ---- */
.carru{margin:0 0 6vh}
.stage{position:relative;background:#151310;border-radius:2px;overflow:hidden;
 box-shadow:0 26px 54px rgba(60,45,20,.28),0 6px 16px rgba(60,45,20,.2)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-snap-type:none}
.slide{flex:0 0 100%;scroll-snap-align:center}
.slide img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;cursor:zoom-in;background:#151310}
.arw{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;
 border:1px solid rgba(255,255,255,.32);background:rgba(20,18,14,.42);backdrop-filter:blur(6px);
 color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
 opacity:.72;transition:opacity .25s,background .25s}
.arw:hover{opacity:1;background:rgba(20,18,14,.8)}
.arw:disabled{opacity:.18;cursor:default}
.arw.prev{left:14px}.arw.next{right:14px}
.dots{display:flex;gap:8px;justify-content:center;padding-top:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:.25s}
.dots i.on{background:var(--accent);transform:scale(1.4)}
@media(max-width:760px){.rail img{height:130px}.rail{gap:32px}.arw{width:38px;height:38px;font-size:15px}}
@media(max-width:760px){.info{grid-template-columns:1fr;gap:22px}.row{flex-direction:column;gap:14px}
 .w100,.w72,.w62,.w60,.w50,.w40{width:100%}.wrap{padding:0 20px}.head{padding:100px 0 10px}}</style></head><body><nav class="nav"><a href="../creativo.html">← Carpetas</a><a class="brand" href="../index.html">1*2U®</a><a href="../arquitectura.html">Clear Side ↗</a></nav><div class="wrap"><header class="head"><div class="k">[07] — Creativo</div><h1>DISEÑO GRÁFICO</h1></header><div class="cover"><div class="card" style="--rot:-1.4deg"><span class="tape"></span><img src="../assets/creativo/disenografico.jpg" alt="DISEÑO GRÁFICO"></div></div><div class="info"><div class="desc">DISEÑO GRÁFICO — proyecto del lado Creativo de 1*2U. Campaña, dirección de imagen y piezas gráficas.</div><div class="credits"></div></div><section class="tira"><div class="lab"><span>Piezas &mdash; lettering &amp; logotipos</span><span class="n">08 piezas &middot; arrastra &larr;&rarr;</span></div><div class="rail" id="rail"><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/02.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/06.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/07.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/09.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/11.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/13.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/20.png" alt=""></figure><figure><img loading="lazy" src="../assets/proyectos/diseno-grafico/22.png" alt=""></figure></div><div class="barra"><i id="barra"></i></div></section><section class="carru"><div class="lab"><span>Portadas</span><span class="n"><b id="cn">01</b> / 10</span></div><div class="stage"><div class="track" id="track"><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/01.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/03.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/04.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/05.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/08.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/10.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/15.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/16.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/17.jpg" alt=""></figure><figure class="slide"><img loading="lazy" src="../assets/proyectos/diseno-grafico/21.jpg" alt=""></figure></div><button class="arw prev" id="prev" aria-label="Anterior">&larr;</button><button class="arw next" id="next" aria-label="Siguiente">&rarr;</button></div><div class="dots" id="dots"></div></section><footer><a href="../creativo.html">← Todas las carpetas</a><a class="next" href="power.html">Siguiente — <b>POWER</b> →</a></footer></div><div class="lb" id="lb"><button class="x" onclick="closeLb()">✕</button><img id="lbimg" src=""></div><script>function openLb(s){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}

(function(){
 // arrastre con mouse para .rail y .track (sin romper el clic)
 function arrastrable(el){
  var abajo=false,x0=0,s0=0,movido=0;
  el.addEventListener('mousedown',function(e){abajo=true;movido=0;x0=e.pageX;s0=el.scrollLeft;el.classList.add('drag');});
  window.addEventListener('mouseup',function(){if(abajo){abajo=false;el.classList.remove('drag');}});
  el.addEventListener('mouseleave',function(){if(abajo){abajo=false;el.classList.remove('drag');}});
  el.addEventListener('mousemove',function(e){
   if(!abajo)return; e.preventDefault();
   var d=e.pageX-x0; movido=Math.max(movido,Math.abs(d)); el.scrollLeft=s0-d;
  });
  el.addEventListener('click',function(e){ if(movido>6){e.preventDefault();e.stopPropagation();} },true);
  return function(){return movido;};
 }

 // --- fila de piezas ---
 var rail=document.getElementById('rail'), barra=document.getElementById('barra');
 if(rail){
  arrastrable(rail);
  function pintaBarra(){
   var vis=Math.min(1, rail.clientWidth/rail.scrollWidth);
   barra.style.width=(vis*100)+'%';
   barra.style.left=(rail.scrollLeft/rail.scrollWidth*100)+'%';
  }
  rail.addEventListener('scroll',pintaBarra); window.addEventListener('resize',pintaBarra);
  window.addEventListener('load',pintaBarra);
  // las imagenes son lazy: recalcular a medida que entran
  rail.querySelectorAll('img').forEach(function(im){
   if(im.complete) return; im.addEventListener('load',pintaBarra);
  });
  if(window.ResizeObserver) new ResizeObserver(pintaBarra).observe(rail);
  pintaBarra();
 }

 // --- carrusel de portadas ---
 var track=document.getElementById('track');
 if(track){
  arrastrable(track);
  var slides=[].slice.call(track.querySelectorAll('.slide'));
  var dots=document.getElementById('dots'), cn=document.getElementById('cn');
  var prev=document.getElementById('prev'), next=document.getElementById('next');
  slides.forEach(function(_,i){
   var d=document.createElement('i');
   d.addEventListener('click',function(){ir(i);});
   dots.appendChild(d);
  });
  function actual(){ return Math.round(track.scrollLeft/track.clientWidth); }
  function ir(i){ track.scrollTo({left:i*track.clientWidth,behavior:'smooth'}); }
  function pinta(){
   var i=Math.max(0,Math.min(slides.length-1,actual()));
   cn.textContent=String(i+1).padStart(2,'0');
   [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===i);});
   prev.disabled=(i===0); next.disabled=(i===slides.length-1);
  }
  prev.addEventListener('click',function(){ir(actual()-1);});
  next.addEventListener('click',function(){ir(actual()+1);});
  track.addEventListener('scroll',pinta);
  window.addEventListener('resize',pinta);
  document.addEventListener('keydown',function(e){
   if(document.getElementById('lb').classList.contains('open'))return;
   if(e.key==='ArrowLeft')ir(actual()-1);
   if(e.key==='ArrowRight')ir(actual()+1);
  });
  pinta();
 }

 // lightbox
 document.querySelectorAll('.rail img,.slide img').forEach(function(im){
  im.addEventListener('click',function(){openLb(this.src);});
 });
})();

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});</script></body></html>
