<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>1*2U — Portafolio</title>
<meta name="description" content="1*2U — fotografía y dirección de imagen. Campañas & diseño gráfico / Clear Side." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#111;--paper:#fbfbf9;--line:#e4e2dd;--dim:rgba(0,0,0,.42);--accent:#ff5a1f;
    --f:'Inter',system-ui,-apple-system,sans-serif;}
  html{scroll-behavior:smooth}
  body{font-family:var(--f);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* top nav — blends over the split */
  .nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;
    align-items:center;padding:20px 34px;font-size:15px;font-weight:500;mix-blend-mode:difference;color:#fff}
  .nav .left{display:flex;gap:26px;align-items:baseline}
  .nav .brand{font-weight:800}
  .nav a{color:#fff;text-decoration:none;opacity:.9;transition:.2s}
  .nav a:hover{opacity:.5}

  .wordmark{display:inline-block;font-weight:800;line-height:.92;letter-spacing:-.02em}

  /* split hero */
  .split{position:relative;height:100vh;display:flex;overflow:hidden}
  .half{flex:1;position:relative;display:block;cursor:pointer;text-decoration:none;transition:background .3s}
  .half-black{background:#000}
  .half-white{background:#fff}
  .half-black:hover{background:#0d0d0d}
  .half-white:hover{background:#f5f5f3}
  .half .hint{position:absolute;bottom:0;left:0;width:100%;padding:28px 34px;
    font-size:14px;font-weight:600;letter-spacing:.01em;opacity:0;transform:translateY(8px);
    transition:.35s;display:flex;justify-content:space-between;align-items:center}
  .half-black .hint{color:#fff}
  .half-white .hint{color:#000;justify-content:flex-end;gap:14px;flex-direction:row-reverse}
  .half:hover .hint{opacity:1;transform:translateY(0)}
  .markwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5}
  .markwrap .wordmark{color:var(--accent);font-size:min(8vw,140px);white-space:nowrap}.wordmark .ast{font-size:.82em;line-height:0;vertical-align:.30em;margin-left:.02em}

  /* intro + footer */
  .lead{padding:64px 34px 40px;max-width:1240px;margin:0 auto}
  .lead p{font-size:clamp(17px,1.5vw,20px);line-height:1.5;max-width:1050px}
  .lead a{color:var(--ink);opacity:.5;text-decoration:none}
  .lead a:hover{opacity:1}
  footer{border-top:1px solid var(--line);margin:0 auto;padding:34px 0 56px;max-width:1240px;
    display:flex;justify-content:space-between;font-size:13px;color:var(--dim);flex-wrap:wrap;gap:12px}

  @media(max-width:820px){
    .split{flex-direction:column}
    .markwrap .wordmark{font-size:min(10vw,110px)}
    .nav{padding:16px 20px;font-size:13px}.nav .left{gap:16px}
    .lead{padding-left:20px;padding-right:20px}
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="left">
      <span class="brand">1*2U®</span>
      <a href="proyectos.html">Work</a>
      <a href="#">Studio</a>
      <a href="#">Contact</a>
    </div>
    <div class="right"><a href="#">Instagram ↗</a></div>
  </nav>

  <div class="split">
    <!-- NEGRO → creativo -->
    <a class="half half-black" href="creativo.html">
      <div class="hint"><span>Campañas &amp; Diseño Gráfico</span><span>→</span></div>
    </a>
    <!-- BLANCO → arquitectura (nube de puntos) -->
    <a class="half half-white" href="arquitectura.html">
      <div class="hint"><span>Clear Side</span><span>→</span></div>
    </a>
    <div class="markwrap"><span class="wordmark">ONETWOYOU<span class="ast">*</span></span></div>
  </div>

  <div class="lead">
    <p>1*2U es fotografía y dirección de imagen. Imagen que vende y espacios que respiran. <a href="#">[Read More…]</a></p>
  </div>
  <footer>
    <span>© 2026 · 1*2U · Medellín, CO</span>
    <span>Fotografía &amp; Dirección de Imagen</span>
    <span>Instagram ↗ · Contacto</span>
  </footer>

</body>
</html>
