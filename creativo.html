<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>1*2U — Creativo · Campañas & Diseño Gráfico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#2b2620;--paper:#ded4c2;--accent:#ff5a1f;--mono:'Space Mono',monospace;--sans:'Inter',sans-serif}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 100% at 50% 0%, #e9e1d2 0%, #ded4c2 45%, #c9bda6 100%);
    -webkit-font-smoothing:antialiased;position:relative}
  /* grano/textura sutil de papel */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:3px 3px}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(80,60,30,.28) 100%)}

  .nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
    padding:20px 30px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .nav a{color:var(--ink);text-decoration:none;opacity:.8}.nav a:hover{opacity:.4}
  .nav .brand{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:0;text-transform:none}

  .head{position:fixed;top:64px;left:30px;z-index:20}
  .head .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .head h1{font-weight:800;font-size:clamp(26px,3.4vw,44px);letter-spacing:-.02em;line-height:1;margin-top:8px}

  /* ---------- coverflow de carpetas ---------- */
  .stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    perspective:1700px;cursor:grab;touch-action:none}
  .stage:active{cursor:grabbing}
  .deck{position:relative;width:320px;height:400px;transform-style:preserve-3d}
  .folder{position:absolute;top:50%;left:50%;width:320px;height:400px;
    transform:translate(-50%,-50%);will-change:transform,opacity;
    transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s ease}
  .folder .card{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;
    box-shadow:0 30px 60px rgba(40,30,10,.45),0 4px 12px rgba(40,30,10,.3);background:#e9e1d2}
  .folder img{width:100%;height:100%;object-fit:cover;display:block}
  .dragging .folder{transition:none}

  /* ---------- info activa ---------- */
  .meta{position:fixed;left:0;right:0;bottom:86px;z-index:20;text-align:center;pointer-events:none}
  .meta .idx{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:rgba(43,38,32,.6)}
  .meta .title{font-weight:800;font-size:clamp(24px,3.6vw,42px);letter-spacing:-.02em;margin:6px 0 12px;
    transition:opacity .3s}
  .meta .open{pointer-events:auto;display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;
    border:1px solid var(--ink);border-radius:2px;padding:9px 16px;transition:.2s;background:rgba(255,255,255,.15)}
  .meta .open:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  .hint{position:fixed;left:0;right:0;bottom:34px;z-index:20;text-align:center;pointer-events:none;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(43,38,32,.55)}
  .hint b{color:var(--accent)}

  /* dots de navegación */
  .dots{position:fixed;left:50%;top:50%;transform:translate(-50%,220px);z-index:20;display:flex;gap:9px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(43,38,32,.3);cursor:pointer;transition:.2s}
  .dots i.on{background:var(--accent);transform:scale(1.3)}

  @media(max-width:640px){
    .deck,.folder{width:250px;height:312px}
    .head{top:58px;left:20px}.nav{padding:16px 20px}
    .dots{transform:translate(-50%,180px)}
  }
</style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">← 1*2U</a>
    <span class="brand">1*2U®</span>
    <a href="arquitectura.html">Clear Side ↗</a>
  </nav>

  <div class="head">
    <div class="k">Creativo</div>
    <h1>Campañas &amp;<br>Diseño Gráfico</h1>
  </div>

  <div class="stage" id="stage">
    <div class="deck" id="deck"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="meta">
    <div class="idx" id="idx">01 / 05</div>
    <div class="title" id="title">NNT LAB</div>
    <a class="open" id="open" href="#">Abrir carpeta →</a>
  </div>

  <div class="hint">Arrastra <b>←→</b> para buscar entre las carpetas · clic para abrir</div>

<script>
  var FOLDERS = [
    {img:'assets/creativo/nntlab.jpg',    title:'NNT LAB',             href:'proyectos/nnt-lab.html'},
    {img:'assets/creativo/lacasa.jpg',    title:'LA CASA QUE HABITO',  href:'proyectos/la-casa-que-habito.html'},
    {img:'assets/creativo/geroangel.jpg', title:'GERO ANGEL',          href:'proyectos/gero-angel.html'},
    {img:'assets/creativo/livin.jpg',     title:'LIVIN EASYWEAR',      href:'proyectos/livin.html'},
    {img:'assets/creativo/bbi.jpg',       title:'BABY BLEU INTERLUDE', href:'proyectos/baby-bleu-interlude.html'},
    {img:'assets/creativo/cole.jpg',      title:'COLE',                href:'proyectos/cole.html'},
    {img:'assets/creativo/disenografico.jpg', title:'DISEÑO GRÁFICO',  href:'proyectos/diseno-grafico.html'},
    {img:'assets/creativo/power.jpg',     title:'POWER',               href:'proyectos/power.html'}
  ];
  var deck=document.getElementById('deck'), dots=document.getElementById('dots');
  var cards=[];
  FOLDERS.forEach(function(f,i){
    var el=document.createElement('div'); el.className='folder';
    el.innerHTML='<div class="card"><img src="'+f.img+'" alt="'+f.title+'"></div>';
    el.addEventListener('click',function(){ if(Math.round(pos)===i) location.href=f.href; else go(i); });
    deck.appendChild(el); cards.push(el);
    var d=document.createElement('i'); d.addEventListener('click',function(){go(i);}); dots.appendChild(d);
  });
  var dotEls=dots.querySelectorAll('i');
  var N=FOLDERS.length, pos=0, active=0;

  function render(){
    cards.forEach(function(c,i){
      var o=i-pos, ao=Math.abs(o);
      var x=o*150, z=-ao*200, ry=Math.max(-48,Math.min(48,-o*24)), sc=Math.max(.55,1-ao*.14);
      var op=ao>3.2?0:1-ao*.16;
      c.style.transform='translate(-50%,-50%) translateX('+x+'px) translateZ('+z+'px) rotateY('+ry+'deg) scale('+sc+')';
      c.style.opacity=op;
      c.style.zIndex=String(200-Math.round(ao*10));
    });
  }
  function setActive(i){
    active=i;
    document.getElementById('idx').textContent=('0'+(i+1)).slice(-2)+' / 0'+N;
    var t=document.getElementById('title'); t.style.opacity=0;
    setTimeout(function(){t.textContent=FOLDERS[i].title; t.style.opacity=1;},150);
    document.getElementById('open').setAttribute('href',FOLDERS[i].href);
    dotEls.forEach(function(d,k){d.className=k===i?'on':'';});
  }
  function go(i){ i=Math.max(0,Math.min(N-1,i)); pos=i; render(); setActive(i); }

  // ---- drag (fraccional) ----
  var stage=document.getElementById('stage');
  var dragging=false, startX=0, startPos=0, STEP=200;
  stage.addEventListener('pointerdown',function(e){dragging=true;startX=e.clientX;startPos=pos;
    document.body.classList.add('dragging');});
  window.addEventListener('pointermove',function(e){
    if(!dragging)return;
    pos=Math.max(-.4,Math.min(N-.6, startPos-(e.clientX-startX)/STEP)); render();
  });
  window.addEventListener('pointerup',function(){
    if(!dragging)return; dragging=false; document.body.classList.remove('dragging');
    go(Math.round(pos));
  });
  // ---- wheel ----
  var wlock=false;
  stage.addEventListener('wheel',function(e){
    e.preventDefault(); if(wlock)return; wlock=true; setTimeout(function(){wlock=false;},280);
    go(active + (Math.abs(e.deltaX)>Math.abs(e.deltaY)? (e.deltaX>0?1:-1):(e.deltaY>0?1:-1)));
  },{passive:false});
  // ---- teclado ----
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(active+1); else if(e.key==='ArrowLeft')go(active-1);
  });

  render(); setActive(0);
</script>
</body>
</html>
